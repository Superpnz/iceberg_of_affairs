<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"rel="stylesheet">
    <link rel="shortcut icon" href="assets/favicon.jpg" type="image/x-icon">
    <script type="module" src="script.js" defer></script>
    <script type="module" src="utilis.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Айсберг дел</title>
</head>

<body>
    <header class="header">
        <h1>АЙСБЕРГ ДЕЛ</h1>
    </header>

    <main>
        <section class="add-input-container">
            <input type="text" placeholder="Введите задачу" class="add-todo-input" data-add-todo-input>
            <button class="add-todo-btn" data-add-todo-btn>Добавить задачу</button>
        </section>

        <section class="search-input-container">
            <input type="text" placeholder="Поиск задач" class="search-todo-input" data-search-todo-input>
        </section>

        <section class="todo-list-container" data-todo-container> </section>
    </main>

    <template data-todo-template>
        <div class="todo">
            <input type="checkbox" class="todo-checkbox" data-todo-checkbox>
            <div class="todo-info">
                <p class="todo-text" data-todo-text>go to jym</p>
                <span class="todo-creation-date" data-todo-date>17-11-2025</span>
            </div>
            <button class="remove-todo-btn" data-remove-todo-btn>X</button>
        </div>
    </template>
</body>

</html>
